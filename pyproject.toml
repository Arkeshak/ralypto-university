[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = [".venv", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["project/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
