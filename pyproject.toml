[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = [".venv", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E731", "E501"]

[tool.pytest.ini_options]
testpaths = ["project/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff.lint.isort]
known-first-party = ["procure", "ui"]

[tool.pyrefly]
search-path = ["project"]
